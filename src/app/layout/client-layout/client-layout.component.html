<div class="h-screen flex bg-bg overflow-hidden">
  <!-- Sidebar -->
  <aside
    class="w-64 shrink-0 bg-surface border-r border-border flex flex-col p-6 h-screen overflow-y-auto"
  >
    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center">
        <span class="text-white font-(--font-display) text-lg">D</span>
      </div>
      <div>
        <p class="font-(--font-display) text-lg text-ink leading-none">Dakar-Tech</p>
        <p class="text-xs text-ink-soft mt-0.5">Wallet</p>
      </div>
    </div>

    <nav class="flex-1 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-primary-light text-primary-dark font-semibold"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-ink-soft hover:bg-primary-light hover:text-primary-dark transition-colors text-sm"
        >
          <svg
            class="w-5 h-5 shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
          >
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="pt-4 border-t border-border">
      <div class="flex items-center gap-3 px-2 mb-3">
        <div
          class="w-9 h-9 rounded-full bg-accent-light flex items-center justify-center text-accent font-semibold text-sm"
        >
          {{ authStore.utilisateur()?.prenom?.charAt(0)
          }}{{ authStore.utilisateur()?.nom?.charAt(0) }}
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-ink truncate">
            {{ authStore.utilisateur()?.prenom }} {{ authStore.utilisateur()?.nom }}
          </p>
          <p class="text-xs text-ink-soft truncate">{{ authStore.utilisateur()?.email }}</p>
        </div>
      </div>
      <button
        (click)="deconnexion()"
        class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-danger hover:bg-red-50 transition-colors text-sm font-medium"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- Contenu principal -->
  <main class="flex-1 h-screen overflow-y-auto">
    <div class="max-w-6xl mx-auto p-8">
      <router-outlet />
    </div>
  </main>
</div>
