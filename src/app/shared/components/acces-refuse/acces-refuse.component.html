<div class="min-h-screen bg-bg flex flex-col items-center justify-center p-6 text-center">
  <div class="w-20 h-20 rounded-3xl bg-red-50 flex items-center justify-center mb-6">
    <svg lucideShieldAlert class="w-10 h-10 text-danger"></svg>
  </div>

  <p class="font-(--font-display) text-6xl text-ink mb-2">403</p>
  <h1 class="font-(--font-display) text-2xl sm:text-3xl text-ink mb-3">Accès refusé</h1>

  <p class="text-sm text-ink-soft max-w-md mb-8">
    Désolé, vous n'avez pas les permissions nécessaires pour accéder à cette page. Si vous pensez
    qu'il s'agit d'une erreur, veuillez vous reconnecter ou contacter un administrateur.
  </p>

  @if (utilisateur(); as u) {
    <p class="text-xs text-ink-soft mb-6">
      Connecté en tant que : <span class="font-medium text-ink">{{ u.email }}</span> ({{ u.role }})
    </p>
  }

  <div class="flex flex-col sm:flex-row gap-3">
    <button
      (click)="accueil()"
      class="px-6 py-2.5 rounded-xl bg-primary text-white text-sm font-medium hover:bg-primary-dark transition-colors"
    >
      Retour à mon espace
    </button>

    <button
      (click)="deconnexion()"
      class="flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl border border-border bg-surface text-danger text-sm font-medium hover:bg-red-50 transition-colors"
    >
      <svg lucideLogOut class="w-4 h-4"></svg>
      Se déconnecter
    </button>
  </div>
</div>
