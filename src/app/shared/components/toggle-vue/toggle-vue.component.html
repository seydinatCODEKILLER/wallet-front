<div class="flex items-center gap-0.5 p-1 rounded-lg bg-bg border border-border">
  @for (option of options(); track option.valeur) {
    <button
      type="button"
      (click)="choisir(option)"
      [class.bg-surface]="valeur() === option.valeur"
      [class.shadow-sm]="valeur() === option.valeur"
      [class.text-ink]="valeur() === option.valeur"
      [class.text-ink-soft]="valeur() !== option.valeur"
      class="h-8 px-2.5 flex items-center gap-1.5 rounded-md text-xs font-medium transition-colors"
      [attr.aria-label]="option.label"
    >
      @if (option.icone === 'list') {
        <svg lucideList class="w-4 h-4"></svg>
      } @else if (option.icone === 'grid') {
        <svg lucideLayoutGrid class="w-4 h-4"></svg>
      } @else if (option.icone === 'table') {
        <svg lucideTable class="w-4 h-4"></svg>
      } @else if (option.icone === 'calendar') {
        <svg lucideCalendar class="w-4 h-4"></svg>
      }
    </button>
  }
</div>
